# Relaticle CRM (https://github.com/relaticle/relaticle) for CloudShift, on Openship (HP Mini Elite).
# Public URL: https://aicrm.app.cloudshiftsolutions.in (TLS at the VPS Caddy, then the Openship edge).
# Same topology as Relaticle's own compose.yml: app (nginx + php-fpm, serves /reverb too), queue worker
# (horizon), scheduler, websocket server (reverb), PostgreSQL and Redis. Image pinned to a release.
# Secrets (APP_KEY, DB_PASSWORD) are set on the Openship services; nothing secret lives in this repo.
services:
  app:
    image: ghcr.io/relaticle/relaticle:3.8.2
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      APP_NAME: ${APP_NAME:-Relaticle}
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
      TRUSTED_HOSTS: localhost
      SESSION_DRIVER: redis
      SESSION_SECURE_COOKIE: "true"
      # Sign-up cannot be switched off; with verification required and no outgoing mail, accounts
      # nobody invited stay locked at "verify your email". Invited members are verified on accept.
      REQUIRE_EMAIL_VERIFICATION: "true"
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@cloudshiftsolutions.in}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Relaticle}
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: relaticle
      DB_USERNAME: relaticle
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      BROADCAST_CONNECTION: reverb
      BROADCAST_REVERB_HOST: reverb
      BROADCAST_REVERB_PORT: "8080"
      BROADCAST_REVERB_SCHEME: http
      AUTORUN_ENABLED: "true"
      AUTORUN_LARAVEL_MIGRATION: "true"
      AUTORUN_LARAVEL_MIGRATION_ISOLATION: "true"
    volumes:
      - storage:/var/www/html/storage/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  horizon:
    image: ghcr.io/relaticle/relaticle:3.8.2
    restart: unless-stopped
    command: ["php", "/var/www/html/artisan", "horizon"]
    stop_signal: SIGTERM
    environment:
      APP_NAME: ${APP_NAME:-Relaticle}
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL}
      REQUIRE_EMAIL_VERIFICATION: "true"
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@cloudshiftsolutions.in}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Relaticle}
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: relaticle
      DB_USERNAME: relaticle
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      BROADCAST_CONNECTION: reverb
      BROADCAST_REVERB_HOST: reverb
      BROADCAST_REVERB_PORT: "8080"
      BROADCAST_REVERB_SCHEME: http
      AUTORUN_ENABLED: "false"
    volumes:
      - storage:/var/www/html/storage/app
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "healthcheck-horizon"]
      start_period: 10s

  scheduler:
    image: ghcr.io/relaticle/relaticle:3.8.2
    restart: unless-stopped
    command: ["php", "/var/www/html/artisan", "schedule:work"]
    stop_signal: SIGTERM
    environment:
      APP_NAME: ${APP_NAME:-Relaticle}
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL}
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: relaticle
      DB_USERNAME: relaticle
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      BROADCAST_CONNECTION: reverb
      BROADCAST_REVERB_HOST: reverb
      BROADCAST_REVERB_PORT: "8080"
      BROADCAST_REVERB_SCHEME: http
      AUTORUN_ENABLED: "false"
    volumes:
      - storage:/var/www/html/storage/app
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "healthcheck-schedule"]
      start_period: 10s

  reverb:
    image: ghcr.io/relaticle/relaticle:3.8.2
    restart: unless-stopped
    command: ["php", "/var/www/html/artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    stop_signal: SIGTERM
    environment:
      APP_NAME: ${APP_NAME:-Relaticle}
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL}
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: relaticle
      DB_USERNAME: relaticle
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CACHE_STORE: redis
      BROADCAST_CONNECTION: reverb
      AUTORUN_ENABLED: "false"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "healthcheck-reverb"]
      start_period: 10s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: relaticle
      POSTGRES_USER: relaticle
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U relaticle -d relaticle"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres:
  redis:
  storage:
